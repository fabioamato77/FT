<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag management survey — before and after AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --ink: #17202e;
    --muted: #5d6879;
    --line: #d9dde4;
    --accent: #8e0000;
    --accent-soft: #f6e4e4;
    --on-accent: #ffffff;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  :root[data-survey="dopo"] {
    --accent: #5e1a2b;
    --accent-soft: #f0e3e7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161d; --surface: #1a2029; --ink: #e8ebf0; --muted: #9aa5b5; --line: #2c3541;
      --accent: #e88282; --accent-soft: #3a1c1e; --on-accent: #240707;
    }
    :root:not([data-theme="light"])[data-survey="dopo"] {
      --accent: #d894a6; --accent-soft: #34202a; --on-accent: #2a0d16;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.55;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 96px; }

  header h1 {
    font-family: var(--serif); font-weight: 600; font-size: clamp(1.9rem, 5vw, 2.7rem);
    line-height: 1.12; margin: 0 0 12px; letter-spacing: -0.01em;
  }
  header p { color: var(--muted); margin: 0; max-width: 60ch; }

  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 28px 0 8px;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface);
  }
  .tab {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font: inherit; padding: 14px 16px; cursor: pointer; text-align: left;
  }
  .tab + .tab { border-left: 1px solid var(--line); }
  .tab strong { display: block; font-family: var(--serif); font-size: 1.1rem; color: var(--ink); font-weight: 600; }
  .tab span { font-size: 0.85rem; }
  .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }
  .tab:focus-visible, .opt:focus-within, button:focus-visible, textarea:focus-visible, input[type=text]:focus-visible, input[type=number]:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }

  .intro { font-size: 0.92rem; color: var(--muted); margin: 14px 0 28px; }

  .progress { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 12px; margin-bottom: 8px; }
  .progress .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress .fill { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .progress .label { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); margin-top: 6px; }

  section.group { margin-top: 36px; }
  section.group > h2 {
    font-family: var(--serif); font-size: 1.35rem; font-weight: 600; margin: 0 0 14px;
    padding-bottom: 8px; border-bottom: 2px solid var(--accent);
  }
  .q {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 18px 16px; margin-bottom: 14px;
  }
  .q.missing { border-color: #b45309; }
  .q legend, .q .qtext { font-weight: 500; margin: 0 0 12px; padding: 0; display: block; }
  .q .hint { display: block; font-weight: 400; font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

  .scale { display: grid; gap: 8px; }
  .scale.n5 { grid-template-columns: repeat(5, 1fr); }
  .scale.n4 { grid-template-columns: repeat(4, 1fr); }
  .scale.n2 { grid-template-columns: repeat(2, 1fr); max-width: 280px; }
  .scale.n11 { grid-template-columns: repeat(11, 1fr); gap: 5px; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .opt .face {
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    min-height: 54px; padding: 8px 4px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); font-size: 0.82rem; line-height: 1.25; transition: background .12s, border-color .12s, color .12s;
  }
  .opt .face b { font-family: var(--mono); font-weight: 500; font-size: 1.05rem; }
  .opt:hover .face { border-color: var(--accent); }
  .opt input:checked + .face { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .scale.n11 .face { min-height: 44px; padding: 6px 0; }
  .ends { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-top: 6px; gap: 12px; }

  textarea, input[type=text], input[type=number] {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  textarea { min-height: 96px; resize: vertical; }
  input[type=number] { max-width: 150px; font-family: var(--mono); }
  .numrow { display: flex; align-items: center; gap: 10px; }
  .numrow span { color: var(--muted); font-size: 0.9rem; }
  .followup { margin-top: 12px; }
  .followup label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 6px; }

  .actions { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  button.primary, button.secondary {
    font: inherit; font-weight: 500; padding: 12px 22px; border-radius: 8px; cursor: pointer; border: 1px solid var(--accent);
  }
  button.primary { background: var(--accent); color: var(--on-accent); }
  button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  button:hover { filter: brightness(0.96); }
  .warn { color: #b45309; font-size: 0.9rem; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .warn, :root:not([data-theme="light"]) .q.missing { color: #f5a64a; border-color: #f5a64a; } }

  .result { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 20px; }
  .result h2 { font-family: var(--serif); margin: 0 0 6px; font-size: 1.3rem; }
  .result p { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }
  .result textarea { font-family: var(--mono); font-size: 0.78rem; min-height: 120px; }
  .result .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  [hidden] { display: none !important; }

  .code-q { margin-top: 20px; }

  @media (max-width: 560px) {
    .scale.n5 { grid-template-columns: 1fr; }
    .scale.n4 { grid-template-columns: 1fr 1fr; }
    .scale.n5 .face { flex-direction: row; justify-content: flex-start; gap: 10px; min-height: 44px; padding: 8px 12px; text-align: left; }
    .scale.n11 { grid-template-columns: repeat(6, 1fr); }
    .tab span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

  .masthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
  .masthead .titles { min-width: 0; flex: 1; }
  .logo { flex: none; width: clamp(110px, 24vw, 190px); height: auto; display: block; border-radius: 6px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .logo { background: #fff; padding: 6px 10px; }
  }
  @media (max-width: 560px) { .masthead { gap: 14px; } }
</style>
</head>

  <div class="tabs" role="tablist" aria-label="Choose a questionnaire">
    <button class="tab" role="tab" id="tab-prima" aria-selected="true" aria-controls="panel" data-s="prima">
      <strong>Before</strong><span>Current manual system</span>
    </button>
    <button class="tab" role="tab" id="tab-dopo" aria-selected="false" aria-controls="panel" data-s="dopo">
      <strong>After</strong><span>After 2-3 weeks with AI</span>
    </button>
  </div>

  <p class="intro" id="intro"></p>

  <div class="progress" aria-hidden="true">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="label" id="plabel"></div>
  </div>

  <main id="panel" role="tabpanel"></main>

  <div class="actions">
    <button class="primary" id="submit" type="button">Finish and generate answers</button>
    <button class="secondary" id="reset" type="button">Clear</button>
    <span class="warn" id="warn" role="alert" hidden></span>
  </div>

  <div class="result" id="result" hidden>
    <h2>Answers ready</h2>
    <p id="resultmsg">Now download the CSV and send it to Simo.</p>
    <textarea id="csv" readonly aria-label="Answers in CSV format"></textarea>
    <div class="row">
      <button class="primary" id="copy" type="button">Copy</button>
      <button class="secondary" id="download" type="button">Download CSV</button>
    </div>
  </div>
</div>

<script>
/* ---------- Scale riutilizzabili ---------- */
const LIKERT = { type: "scale", ends: ["Strongly disagree", "Strongly agree"],
  options: [1,2,3,4,5].map(n => ({ v: String(n), label: String(n), num: true })) };
const FREQ = { type: "scale", options: ["Never","Rarely","Sometimes","Often","Always"].map((t,i) => ({ v: String(i+1), label: t })) };
const q = (id, text, base, extra = {}) => Object.assign({ id, text }, base, extra);

/* ---------- Contenuto dei due questionari ---------- */
const SURVEYS = {
  prima: {
    intro: "Answer thinking about the manual system you use today. There are no right or wrong answers. We are interested in your perception and experience, not an exact measurement.",
    groups: [
      { title: "Time and workload", items: [
        q("t_minuti", "On average, how many minutes would you estimate you spend completing the tagging step for an article, including choosing and entering the tags?", { type: "number", unit: "minutes" }),
        q("t_difficolta", "Finding the right tags by searching for them in the search field is complicated.", LIKERT),
        q("t_salta", "How often do you skip or cut short the tagging step because you are short of time?", FREQ),
      ]},
      { title: "Quality and consistency", items: [
        q("q_coerenza", "I am confident the tags used in our articles are consistent with one another.", LIKERT),
        q("q_duplicate", "I sometimes don't know which to choose because the list has duplicate or near-identical tags.", FREQ),
      ]},
      { title: "Satisfaction and expectations", items: [
        q("s_soddisfazione", "I am satisfied with the current tag management system.", LIKERT),
        q("s_fiducia", "I trust the tags an AI system would propose.", LIKERT),
        q("s_preoccupazioni", "Do you have concerns about automating this task?", { type: "scale",
          options: ["None","A few","Some","Many"].map((t,i) => ({ v: String(i+1), label: t })) },
          { followup: "If you like, explain what your concerns are" }),
        q("a_commento", "What bothers you most about the current system, and what do you expect from an automated one?", { type: "open" }),
      ]},
    ]
  },
  dopo: {
    intro: "Answer thinking about the AI-based system, after using it for at least 2-3 weeks. Many questions repeat those in the first questionnaire so the two can be compared. We are interested in your perception and experience, not an exact measurement: answer from your impression.",
    groups: [
      { title: "Time and workload", items: [
        q("u_articoli", "Approximately how many articles have you used the AI tagging assistant on during the test period?", { type: "number", unit: "articles", max: 100000, step: 1 }),
        q("t_minuti", "On average, how many minutes would you estimate you spend completing the tagging step for an article, including reviewing, correcting or confirming the AI-generated tags?", { type: "number", unit: "minutes" }),
        q("t_difficolta", "Finding the right tags by searching for them in the search field is complicated.", LIKERT),
        q("t_salta", "How often do you skip or cut short the tagging step because you are short of time?", FREQ),
        q("t_confronto", "Compared with the previous system, the time you spend on tags is:", { type: "scale",
          options: ["Much less","Less","Unchanged","More","Much more"].map((t,i) => ({ v: String(i+1), label: t })) }),
      ]},
      { title: "Quality and consistency", items: [
        q("q_coerenza", "I am confident the tags used in our articles are consistent with one another.", LIKERT),
        q("q_duplicate", "I sometimes don't know which to choose because the list has duplicate or near-identical tags.", FREQ),
        q("q_corrette", "In your experience, how often do the tags proposed by the system seem correct without needing changes?", FREQ),
      ]},
      { title: "Trust, control and integration", items: [
        q("s_fiducia", "I trust the tags proposed by the AI.", LIKERT),
        q("s_controllo", "I feel I have the final say on the tags that end up on the article.", LIKERT),
        q("s_integrazione", "The system fits well into my daily workflow.", LIKERT),
      ]},
      { title: "In your own words", items: [
        q("a_cambieresti", "What would you change about the system?", { type: "open" }),
      ]},
    ]
  }
};

/* ---------- Stato e rendering ---------- */
function newCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const c = Array.from(crypto.getRandomValues(new Uint8Array(6)), x => A[x % A.length]).join("");
  return c.slice(0, 3) + "-" + c.slice(3);
}
const state = { prima: {}, dopo: {}, codePrima: newCode(), codeDopo: "" };
let current = "prima";
const panel = document.getElementById("panel");

function allItems(s) { return SURVEYS[s].groups.flatMap(g => g.items); }
function answered(item, s) {
  const v = state[s][item.id];
  return v !== undefined && String(v).trim() !== "";
}
/* Le domande aperte e i commenti di approfondimento sono facoltativi; il resto è obbligatorio. */
function required(item) { return item.type !== "open"; }

function render() {
  const s = current, data = SURVEYS[s];
  document.documentElement.dataset.survey = s;
  document.getElementById("intro").textContent = data.intro;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.s === s));
  panel.setAttribute("aria-labelledby", "tab-" + s);
  panel.innerHTML = "";

  data.groups.forEach(g => {
    const sec = document.createElement("section");
    sec.className = "group";
    sec.innerHTML = `<h2>${g.title}</h2>`;
    g.items.forEach(item => sec.appendChild(buildQuestion(item, s)));
    panel.appendChild(sec);
  });

  const codeSec = document.createElement("section");
  codeSec.className = "group";
  codeSec.innerHTML = `<h2>For comparing the two questionnaires</h2>`;
  const box = document.createElement("div");
  box.className = "q";
  box.innerHTML = current === "prima"
    ? `<label class="qtext" for="code">Your random code <span class="hint">This code is randomly generated and is not linked to you. Write it down somewhere: you will need it in the second questionnaire to match your answers.</span></label>
       <input type="text" id="code" readonly value="${state.codePrima}">`
    : `<label class="qtext" for="code">Code from the first questionnaire <span class="hint">Enter the random code you received in the first questionnaire. It is only used to match your answers, not to identify you. If you no longer have it, leave this empty. Optional.</span></label>
       <input type="text" id="code" maxlength="20" autocomplete="off" value="${state.codeDopo.replace(/"/g, "")}">`;
  const codeInput = box.querySelector("input");
  if (current === "prima") codeInput.addEventListener("focus", () => codeInput.select());
  else codeInput.addEventListener("input", e => { state.codeDopo = e.target.value.trim().toUpperCase(); });
  codeSec.appendChild(box);
  panel.appendChild(codeSec);

  updateProgress();
}

function buildQuestion(item, s) {
  const wrap = document.createElement("div");
  wrap.className = "q";
  wrap.dataset.id = item.id;
  const reqMark = required(item) ? "" : `<span class="hint">Optional</span>`;

  if (item.type === "scale") {
    const fs = document.createElement("fieldset");
    const cols = item.cols || item.options.length;
    fs.innerHTML = `<legend>${item.text}${reqMark}</legend>`;
    const grid = document.createElement("div");
    grid.className = "scale n" + cols;
    item.options.forEach(o => {
      const lab = document.createElement("label");
      lab.className = "opt";
      const checked = state[s][item.id] === o.v ? "checked" : "";
      lab.innerHTML = `<input type="radio" name="${s}_${item.id}" value="${o.v}" ${checked}><span class="face">${o.num ? `<b>${o.label}</b>` : o.label}</span>`;
      lab.querySelector("input").addEventListener("change", () => { state[s][item.id] = o.v; wrap.classList.remove("missing"); updateProgress(); });
      grid.appendChild(lab);
    });
    fs.appendChild(grid);
    if (item.ends) fs.insertAdjacentHTML("beforeend", `<div class="ends"><span>${item.ends[0]}</span><span>${item.ends[1]}</span></div>`);
    wrap.appendChild(fs);
    if (item.followup) {
      const fu = document.createElement("div");
      fu.className = "followup";
      const key = item.id + "_testo";
      fu.innerHTML = `<label for="${s}_${key}">${item.followup} <em>(optional)</em></label><textarea id="${s}_${key}" rows="3"></textarea>`;
      const ta = fu.querySelector("textarea");
      ta.value = state[s][key] || "";
      ta.addEventListener("input", () => { state[s][key] = ta.value; });
      wrap.appendChild(fu);
    }
  } else if (item.type === "number") {
    wrap.innerHTML = `<label class="qtext" for="${s}_${item.id}">${item.text}</label>
      <div class="numrow"><input type="number" id="${s}_${item.id}" min="0" max="${item.max ?? 600}" step="${item.step ?? 0.5}" inputmode="decimal" value="${state[s][item.id] ?? ""}"><span>${item.unit}</span></div>`;
    wrap.querySelector("input").addEventListener("input", e => { state[s][item.id] = e.target.value; wrap.classList.remove("missing"); updateProgress(); });
  } else {
    wrap.innerHTML = `<label class="qtext" for="${s}_${item.id}">${item.text}${reqMark}</label>
      <textarea id="${s}_${item.id}" rows="4" placeholder="Write your answer here"></textarea>`;
    const ta = wrap.querySelector("textarea");
    ta.value = state[s][item.id] || "";
    ta.addEventListener("input", () => { state[s][item.id] = ta.value; });
  }
  return wrap;
}

function updateProgress() {
  const items = allItems(current).filter(required);
  const done = items.filter(i => answered(i, current)).length;
  document.getElementById("fill").style.width = (items.length ? (done / items.length) * 100 : 0) + "%";
  document.getElementById("plabel").textContent = `${done} of ${items.length} required questions`;
}

/* ---------- Azioni ---------- */
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  current = t.dataset.s;
  document.getElementById("result").hidden = true;
  document.getElementById("warn").hidden = true;
  render();
  window.scrollTo({ top: 0 });
}));

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Clear all answers in this questionnaire?")) return;
  state[current] = {};
  document.getElementById("result").hidden = true;
  render();
});

function esc(v) { v = String(v ?? ""); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

document.getElementById("submit").addEventListener("click", () => {
  const warn = document.getElementById("warn");
  const missing = allItems(current).filter(i => required(i) && !answered(i, current));
  document.querySelectorAll(".q.missing").forEach(n => n.classList.remove("missing"));
  if (missing.length) {
    missing.forEach(i => panel.querySelector(`[data-id="${i.id}"]`)?.classList.add("missing"));
    warn.textContent = `${missing.length} required answers are missing, highlighted in red.`;
    warn.hidden = false;
    panel.querySelector(`[data-id="${missing[0].id}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  warn.hidden = true;

  const keys = ["questionario", "codice", "data"];
  const vals = [current, (current === "prima" ? state.codePrima : state.codeDopo), new Date().toISOString()];
  allItems(current).forEach(i => {
    keys.push(i.id); vals.push(state[current][i.id] ?? "");
    if (i.followup) { keys.push(i.id + "_testo"); vals.push(state[current][i.id + "_testo"] ?? ""); }
  });
  const csv = keys.map(esc).join(";") + "\n" + vals.map(esc).join(";");
  document.getElementById("csv").value = csv;
  document.getElementById("resultmsg").textContent = current === "prima"
    ? `Now download the CSV and send it to Simo. Write down your random code (${state.codePrima}): you will need it in the second questionnaire.`
    : "Now download the CSV and send it to Simo.";
  const r = document.getElementById("result");
  r.hidden = false;
  r.scrollIntoView({ behavior: "smooth", block: "start" });
});

document.getElementById("copy").addEventListener("click", async e => {
  const ta = document.getElementById("csv");
  try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand("copy"); }
  e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = "Copy", 1800);
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob(["\ufeff" + document.getElementById("csv").value], { type: "text/csv;charset=utf-8" });
  const rawCode = current === "prima" ? state.codePrima : state.codeDopo;
  const codeName = (rawCode || "").replace(/[^A-Za-z0-9-]/g, "") || "no-code";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `tag-survey-en-${codeName}-${current}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
});

render();
</script>
</body>
</html>
